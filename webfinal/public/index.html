<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banking Operation Log</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-3gJwYpOJpM2Vd6rsenp7m5GIk5fH0hS43pLaS5Hj6t4=" crossorigin="anonymous"></script>
  <script>window.jQuery || document.write('<script src="js/jquery-3.7.1.min.js"><\/script>');</script>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Operation Log</h1>
      <p>Track banking actions with quick CRUD.</p>
    </div>
    <div id="status" aria-live="polite"></div>
  </header>

  <main>
    <section class="card">
      <div class="card-header">
        <h2 id="form-title">Create Entry</h2>
      </div>
      <form id="item-form" autocomplete="off">
        <input type="hidden" id="item-id" />
        <label for="title">Title</label>
        <input id="title" name="title" required placeholder="e.g., Cash deposit" />

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3" placeholder="Short note..."></textarea>

        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" step="0.01" placeholder="0.00" />

        <div class="actions">
          <button type="submit" id="save-btn">Save</button>
          <button type="button" id="cancel-btn" class="ghost" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Entries</h2>
        <button type="button" id="refresh-btn" class="ghost">Refresh</button>
      </div>
      <div class="table-wrap">
        <table id="items-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Amount</th>
              <th>Updated</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card logs-card">
      <div class="card-header">
        <h2>Operation Logs</h2>
        <div>
          <button type="button" id="refresh-logs-btn" class="ghost">Refresh</button>
          <button type="button" id="clear-logs-btn" class="ghost">Clear</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="logs-table">
          <thead>
            <tr>
              <th>Action</th>
              <th>Item</th>
              <th>Details</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
